<!-- area:start-and-loading start (welcome screen) -->
<section id="welcome-screen" class="welcome" aria-labelledby="welcome-title">
  <div class="welcome-card panel">
    <div class="welcome-hero" aria-hidden="true">
      <img src="{{BASE}}assets/items/BigChestIcon.webp" width="168" height="168" alt="" fetchpriority="high" />
    </div>
    <h1 id="welcome-title" class="welcome-title">See what's in your next box.</h1>
    <div class="welcome-actions action-bar">
      <button id="welcome-load-save" type="button" class="btn btn--go btn--lg btn--block">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2.2h7A2.5 2.5 0 0 1 21 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg>
        Load my save
      </button>
      <button id="load-demo" type="button" class="btn btn--primary btn--block">Try demo</button>
    </div>
    <p class="welcome-lock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 1 5 5v3h.5A2.5 2.5 0 0 1 20 12.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 19.5v-7A2.5 2.5 0 0 1 6.5 10H7V7a5 5 0 0 1 5-5Zm0 3a2 2 0 0 0-2 2v3h4V7a2 2 0 0 0-2-2Z"/></svg>
      Your save stays on this device.
    </p>
    <div id="import-status" class="import-status" role="status" aria-live="polite"></div>
    <details class="welcome-help">
      <summary>What's a save file?</summary>
      <p>It's your Eatventure save (.json). It's read here, never uploaded.</p>
      <p>No file? Tap Try demo.</p>
    </details>
  </div>
  <p class="app-footer">Fan-made. Not affiliated with Eatventure or Lessmore.</p>
</section>
<!-- area:start-and-loading end -->
