<!-- area:marking-history-savemenu start (Settings rows for marking many boxes) -->
<div class="setting-group">
  <div class="setting-buttons">
    <button type="button" class="open-btn btn btn--primary btn--sm" data-open="5" disabled>Mark 5 opened</button>
    <button type="button" class="open-btn btn btn--primary btn--sm" data-open="10" disabled>Mark 10 opened</button>
  </div>
  <div class="setting-row panel-row">
    <label for="open-custom">How many?</label>
    <input id="open-custom" type="number" value="25" min="1" max="10000" class="field" />
    <button id="open-custom-go" type="button" class="btn btn--primary btn--sm" disabled>Mark opened</button>
  </div>
</div>
<!-- area:marking-history-savemenu end -->
