<!-- area:settings-help-errors start (Help sheet) -->
<div id="help-sheet" class="sheet-layer is-hidden">
  <div class="sheet-backdrop" data-sheet-close></div>
  <div class="sheet help-sheet" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="help-title" class="sheet-title">How it works</h2>
      <button type="button" class="icon-btn btn btn--ghost sheet-close" data-sheet-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5.6 5.6a2 2 0 0 1 2.8 0L12 9.2l3.6-3.6a2 2 0 1 1 2.8 2.8L14.8 12l3.6 3.6a2 2 0 1 1-2.8 2.8L12 14.8l-3.6 3.6a2 2 0 1 1-2.8-2.8L9.2 12 5.6 8.4a2 2 0 0 1 0-2.8Z"/></svg></button>
    </div>
    <ul class="help-rows">
      <li class="help-row">
        <span class="help-pic"><span class="box-art help-box" data-box="big"><img src="{{BASE}}assets/items/BigChestIcon.webp" width="64" height="64" alt="" /></span></span>
        <span class="help-text">Pick a box.</span>
      </li>
      <li class="help-row">
        <span class="help-pic help-pic--tiles">
          <span class="item-tile item-tile--mini" data-rarity="Rare" title="Silver Ring · Rare"><img src="{{BASE}}assets/items/Ring_Silver.webp" width="48" height="48" alt="" /></span>
          <span class="item-tile item-tile--mini" data-rarity="Legendary" title="Snake Ring · Legendary"><img src="{{BASE}}assets/items/Ring_Snake.webp" width="48" height="48" alt="" /></span>
        </span>
        <span class="help-text">See what comes out, in order.</span>
      </li>
      <li class="help-row">
        <span class="help-pic"><span class="btn btn--go btn--mini" aria-hidden="true">I opened it!</span></span>
        <span class="help-text">Opened it in the game? Tap <b class="help-nowrap">I opened it!</b></span>
      </li>
      <li class="help-row">
        <span class="help-pic">
          <span class="help-disc help-disc--find"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10.5 2a8.5 8.5 0 0 1 6.9 13.5l4 4a2 2 0 1 1-2.9 2.9l-4-4A8.5 8.5 0 1 1 10.5 2Zm0 3.6a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8Z"/></svg></span>
          <span class="item-tile item-tile--mini" data-rarity="Epic" title="Penguin · Epic"><img src="{{BASE}}assets/items/Pet_Penguin.webp" width="48" height="48" alt="" /></span>
        </span>
        <span class="help-text"><b>Find</b> shows when your item comes.</span>
      </li>
      <li class="help-row">
        <span class="help-pic">
          <span class="help-disc help-disc--xp"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.2c.6 0 1.1.3 1.4.9l2.4 4.9 5.4.8c1.3.2 1.8 1.8.9 2.7l-3.9 3.8.9 5.4c.2 1.3-1.1 2.3-2.3 1.7L12 19.8l-4.8 2.6c-1.2.6-2.5-.4-2.3-1.7l.9-5.4-3.9-3.8c-.9-.9-.4-2.5.9-2.7l5.4-.8 2.4-4.9c.3-.6.8-.9 1.4-.9Z"/></svg></span>
          <span class="box-art help-adventure" data-box="zeus"><img src="{{BASE}}assets/items/GreekAdventureIcon.webp" width="48" height="48" alt="" /></span>
        </span>
        <span class="help-text"><b>XP</b> plans the most XP for your keys.</span>
      </li>
      <li class="help-row">
        <span class="help-pic"><span class="help-disc help-disc--lock"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 1 5 5v3h.5A2.5 2.5 0 0 1 20 12.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 19.5v-7A2.5 2.5 0 0 1 6.5 10H7V7a5 5 0 0 1 5-5Zm0 3a2 2 0 0 0-2 2v3h4V7a2 2 0 0 0-2-2Z"/></svg></span></span>
        <span class="help-text">Your save stays on this device.</span>
      </li>
    </ul>
  </div>
</div>
<!-- area:settings-help-errors end -->
