<!-- area:xp-planner start (Settings rows for XP, adventure boxes only) -->
<div id="xp-settings" class="setting-group xp-settings">
  <label class="setting-row panel-row" for="xp-maxopens">XP: max opens<input id="xp-maxopens" type="number" min="1" placeholder="No limit" class="field" /></label>
  <!-- Hidden mirror of #vault: the XP search checks both agree. Never show a second vault field. -->
  <label class="is-hidden" for="xp-vault">Vault key chance (%)<input id="xp-vault" type="number" value="0" min="0" max="100" step="any" /></label>
</div>
<!-- area:xp-planner end -->
