<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loot Predictor</title>
  </head>
  <body>
    <h1>Loot Predictor</h1>
    <p>Load a savegame export. Nothing is uploaded — parsing happens in your browser.</p>
    <label>Savegame <input id="save" type="file" accept=".json,application/json" /></label>
    <label>Chest <select id="chest"></select></label>
    <label>Opens <input id="count" type="number" value="5" min="1" /></label>
    <label>Vault % <input id="vault" type="number" value="0" min="0" max="100" /></label>
    <button id="run">Predict</button>
    <div id="out"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
